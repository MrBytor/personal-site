          def api(path, body=None, method=None):
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(base + path, data=data, headers=headers, method=method or ('POST' if data is not None else 'GET'))
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          assert api('')['private'], 'Repository must remain private.'
          for item in manifest['large']:
              url = 'https://raw.githubusercontent.com/MrBytor/projects/' + source_commit + '/academic-preview/' + urllib.parse.quote(item['path'], safe='/')
              with urllib.request.urlopen(url, timeout=120) as response:
                  content = response.read()
              actual = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              assert actual == item['sha'], 'Source file checksum mismatch: ' + item['path']
              result = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(content).decode()})
